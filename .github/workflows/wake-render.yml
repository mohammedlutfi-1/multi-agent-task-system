name: Wake Render Collaboration Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-render-collaboration
  cancel-in-progress: false

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake backend and verify health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 10 \
            --max-time 120 \
            "https://multi-agent-task-system.onrender.com/health"
