services:
- type: web
  name: multi-agent-task-system-api
  runtime: python
  rootDir: backend
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  envVars:
  - key: PYTHON_VERSION
    value: 3.13.1
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_SERVICE_ROLE_KEY
    sync: false
  - key: API_KEY_ENCRYPTION_KEY
    sync: false
  - key: GROQ_API_KEY
    sync: false
  - key: GEMINI_API_KEY
    sync: false
  - key: OPENROUTER_API_KEY
    sync: false
  - key: ENABLE_AUTO_RESUME
    value: 'true'
  - key: OLLAMA_WORKER_SECRET
    sync: false
  - key: ENABLE_LOCAL_OLLAMA
    value: 'false'
  - key: PLATFORM_GROQ_DAILY_LIMIT
    value: '50'
  - key: PLATFORM_GEMINI_DAILY_LIMIT
    value: '50'
  - key: PLATFORM_OPENROUTER_DAILY_LIMIT
    value: '20'
